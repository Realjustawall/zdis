name: Quality

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 1 * * 0'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dedicated-clients:
    name: Build and verify signed dedicated APK and EXE
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test builder and native source checks
        run: python tests/native-clients.test.py -v
      - name: Install Windows signature verifier
        run: sudo apt-get update && sudo apt-get install -y osslsigncode
      - name: Build both clients using the server installer builder
        run: >-
          python scripts/build-server-clients.py --url https://ci.zdis.invalid
          --output "$RUNNER_TEMP/dedicated-clients"
          --signing-dir "$RUNNER_TEMP/dedicated-signing"
      - name: Verify hashes, embedded Android server and Windows signature
        run: |
          python scripts/verify-native-artifacts.py "$RUNNER_TEMP/dedicated-clients" --origin https://ci.zdis.invalid
          cat /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/dedicated-clients/ZDis-Server-Certificate.crt" > "$RUNNER_TEMP/ci-signing-roots.pem"
          osslsigncode verify -CAfile "$RUNNER_TEMP/ci-signing-roots.pem" \
            -in "$RUNNER_TEMP/dedicated-clients/ZDis-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: dedicated-client-candidates
          path: ${{ runner.temp }}/dedicated-clients/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove disposable CI signing keys
        if: always()
        run: sudo rm -rf -- "$RUNNER_TEMP/dedicated-signing"

  android-install:
    name: Install and launch dedicated APK on Android emulator
    needs: dedicated-clients
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: dedicated-client-candidates
          path: native-candidates
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python scripts/smoke-android-client.py native-candidates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-install-diagnostics
          path: native-candidates/android-*.txt

  windows-install:
    name: Verify, install and launch dedicated Windows client
    needs: dedicated-clients
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dedicated-client-candidates
          path: native-candidates
      - name: Install archive inspection dependencies
        run: npm ci --prefix native/windows
      - name: Verify signature and run installer smoke test
        shell: pwsh
        run: ./scripts/smoke-windows-client.ps1 -Candidates native-candidates

  native-runtime:
    name: Native SQLite runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:windows
      - name: Test release packaging
        run: python -m unittest discover -s tests -p package_release_test.py -v
      - name: Build and verify platform release archive
        shell: bash
        run: |
          platform=ubuntu
          extension=tar.gz
          if [[ "$RUNNER_OS" == Windows ]]; then platform=windows; extension=zip; fi
          version=$(node -p "require('./package.json').version")
          python scripts/package-release.py --platform "$platform" \
            --output "$RUNNER_TEMP/release/zdis-v$version-$platform.$extension"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ runner.os }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14

  infrastructure-validation:
    name: Kubernetes, Compose and Terraform validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.3
      - uses: hashicorp/setup-terraform@v3
      - name: Parse every repository YAML document
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { parseAllDocuments } from 'yaml';
          const roots = ['infra', '.github/workflows'];
          for (const root of roots) {
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const file = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(file);
                else if (/\.ya?ml$/i.test(file)) {
                  for (const document of parseAllDocuments(fs.readFileSync(file, 'utf8'))) {
                    if (document.errors.length) throw document.errors[0];
                  }
                }
              }
            };
            walk(root);
          }
          NODE
      - name: Render Kubernetes deployment
        run: |
          kubectl kustomize infra/kubernetes > /tmp/zdis-kubernetes.yaml
      - name: Validate Compose models
        env:
          APP_SECRET: validation-app-secret-with-at-least-thirty-two-characters
          POSTGRES_PASSWORD: validation-postgres-password
          SCALE_ADMIN_PASSWORD: Validation-Admin-Password-2026!
          SEED_ADMIN_PASSWORD: Validation-Admin-Password-2026!
          MINIO_ROOT_USER: validation
          MINIO_ROOT_PASSWORD: Validation-Minio-Password-2026!
          LIVEKIT_API_KEY: validation-key
          LIVEKIT_API_SECRET: validation-secret
          LIVEKIT_NODE_IP: 127.0.0.1
          TURN_SHARED_SECRET: validation-turn-secret
          GRAFANA_ADMIN_PASSWORD: Validation-Grafana-Password-2026!
        run: |
          docker compose -f infra/docker-compose.scale.yml config --quiet
          docker compose -f infra/docker-compose.enterprise.yml config --quiet
      - name: Validate and format-check Route53 module
        working-directory: infra/multiregion/route53
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  supply-chain-security:
    name: Dependency, secret and image scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production and build-tool dependency audit
        run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Scan repository, IaC and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivyignores: .trivyignore.yaml
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build production image
        run: docker build -t zdis:${{ github.sha }} .
      - name: Scan production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: zdis:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

  postgres-redis-integration:
    name: PostgreSQL + Redis integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ZDIS
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: ZDIS_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ZDIS -d ZDIS_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clamav:
        image: clamav/clamav:1.4
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdscan --ping 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 90s
      localstack:
        image: localstack/localstack:4.6
        env:
          SERVICES: s3
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://ZDIS:integration-password@127.0.0.1:5432/ZDIS_test
      REDIS_URL: redis://127.0.0.1:6379
      REQUIRE_POSTGRES: 'true'
      REQUIRE_REDIS: 'true'
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: 3310
      CLAMAV_REQUIRED: 'true'
      STORAGE_DRIVER: s3
      S3_REGION: us-east-1
      S3_ENDPOINT: http://127.0.0.1:4566
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:4566
      S3_BUCKET: zdis-ci
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL backup tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create private S3 test bucket
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: aws --endpoint-url http://127.0.0.1:4566 s3 mb s3://zdis-ci
      - run: npm run build
      - run: npm test

  browser-e2e:
    name: Playwright browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GALLERY_LAYOUT_AUDIT: '1'
      GALLERY_PHASE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  browser-sfu:
    name: Playwright LiveKit media E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_E2E_PORT: '18081'
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_URL: http://127.0.0.1:7880
      LIVEKIT_API_KEY: ci-key
      LIVEKIT_API_SECRET: ci-only-livekit-secret-with-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start isolated LiveKit media server
        run: |
          # Permission tests intentionally do not grant camera/microphone access.
          # Advertise the runner's reachable interface, not a loopback ICE address.
          node_ip=$(hostname -I | awk '{print $1}')
          test -n "$node_ip"
          docker run -d --name zdis-ci-livekit --network host \
            livekit/livekit-server:v1.13.7 --dev --bind 0.0.0.0 \
            --node-ip "$node_ip" --keys "$LIVEKIT_API_KEY: $LIVEKIT_API_SECRET"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7880 >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs zdis-ci-livekit
          exit 1
      - run: npm run build
      - name: Verify live SFU tracks and publication permissions
        run: >-
          node tests/run-browser.mjs --suite=direct-voice-sfu --suite=voice-permissions-sfu
          --suite=voice-ui-sfu --suite=listener-voice --retries=0
      - name: Capture SFU diagnostics
        if: always()
        run: docker logs zdis-ci-livekit > livekit-ci.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-sfu-report
          path: |
            playwright-report/
            test-results/
            livekit-ci.log
          retention-days: 14
      - name: Stop isolated media server
        if: always()
        run: docker rm -f zdis-ci-livekit || true
