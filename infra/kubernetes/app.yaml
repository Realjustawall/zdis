apiVersion: v1
kind: ConfigMap
metadata:
  name: youtbelimo-config
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "4000"
  TRUST_PROXY: "true"
  SECURE_COOKIES: "true"
  REQUIRE_POSTGRES: "true"
  REQUIRE_REDIS: "true"
  REDIS_CLUSTER_NODES: redis-cluster-0.redis-cluster-headless:6379,redis-cluster-1.redis-cluster-headless:6379,redis-cluster-2.redis-cluster-headless:6379
  STORAGE_DRIVER: s3
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: "false"
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  CLAMAV_REQUIRED: "true"
  LIVEKIT_API_URL: http://livekit-api:7880
  LIVEKIT_MAX_PARTICIPANTS: "500"
  JOB_CONCURRENCY: "20"
  WORKER_METRICS_PORT: "9464"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  BACKUP_RETENTION_DAYS: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: &api-labels
    app.kubernetes.io/name: youtbelimo
    app.kubernetes.io/component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *api-labels
  template:
    metadata:
      labels: *api-labels
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *api-labels
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *api-labels
      containers:
        - name: api
          image: ghcr.io/your-org/youtbelimo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: youtbelimo-config
            - secretRef:
                name: youtbelimo-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: youtbelimo-api
            - name: DATA_DIR
              value: /tmp/youtbelimo
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
          resources:
            requests:
              cpu: 300m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: youtbelimo
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: youtbelimo
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: &worker-labels
    app.kubernetes.io/name: youtbelimo
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels: *worker-labels
  template:
    metadata:
      labels: *worker-labels
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *worker-labels
      containers:
        - name: worker
          image: ghcr.io/your-org/youtbelimo:1.0.0
          command: ["npm", "run", "worker", "--workspace", "server"]
          envFrom:
            - configMapRef:
                name: youtbelimo-config
            - secretRef:
                name: youtbelimo-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: youtbelimo-worker
            - name: DATA_DIR
              value: /tmp/youtbelimo
            - name: BACKUP_DIR
              value: /tmp/backups
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
          ports:
            - name: metrics
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  labels:
    app.kubernetes.io/name: youtbelimo
    app.kubernetes.io/component: worker
spec:
  selector:
    app.kubernetes.io/name: youtbelimo
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 30
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: youtbelimo
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: youtbelimo
      app.kubernetes.io/component: worker
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-body-size: 12m
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: ytbl_ingress
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [chat.example.com]
      secretName: chat-tls
  rules:
    - host: chat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
