apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clamav
    spec:
      containers:
        - name: clamav
          image: clamav/clamav:1.4
          ports:
            - name: clamd
              containerPort: 3310
          startupProbe:
            tcpSocket:
              port: clamd
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1.5Gi
            limits:
              cpu: "2"
              memory: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
spec:
  selector:
    app.kubernetes.io/name: clamav
  ports:
    - name: clamd
      port: 3310
      targetPort: clamd
