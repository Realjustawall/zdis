apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-egress-config
data:
  egress.yaml: |
    ws_url: ws://livekit-api:7880
    redis:
      cluster_addresses:
        - redis-cluster-0.redis-cluster-headless:6379
        - redis-cluster-1.redis-cluster-headless:6379
        - redis-cluster-2.redis-cluster-headless:6379
    health_port: 8080
    prometheus_port: 9090
    log_level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-egress
  labels: &labels
    app.kubernetes.io/name: livekit-egress
    app.kubernetes.io/component: recording
spec:
  replicas: 2
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      terminationGracePeriodSeconds: 300
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *labels
      containers:
        - name: egress
          image: livekit/egress:v1.12.0
          envFrom:
            - secretRef:
                name: youtbelimo-secrets
          env:
            - name: EGRESS_CONFIG_FILE
              value: /etc/livekit-egress/egress.yaml
          ports:
            - name: health
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["SYS_ADMIN"]
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/livekit-egress
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 8Gi
      volumes:
        - name: config
          configMap:
            name: livekit-egress-config
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: livekit-egress
spec:
  minAvailable: 1
  selector:
    matchLabels: *labels
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: livekit-egress
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: livekit-egress
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
