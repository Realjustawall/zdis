# Do not apply this file unchanged. Prefer External Secrets, Sealed Secrets, or
# the cloud provider's CSI secret store, and create a Secret with this name.
apiVersion: v1
kind: Secret
metadata:
  name: youtbelimo-secrets
  namespace: youtbelimo
type: Opaque
stringData:
  APP_SECRET: REPLACE_ME_WITH_48_RANDOM_CHARACTERS
  AUDIT_SIGNING_KEY: REPLACE_ME_WITH_AN_INDEPENDENT_AUDIT_KEY
  RECOVERY_CODE_SIGNING_KEY: REPLACE_ME_WITH_AN_INDEPENDENT_RECOVERY_KEY
  DATABASE_URL: postgres://app:REPLACE_ME@postgres-pooler-rw:5432/youtbelimo
  READ_DATABASE_URL: postgres://app:REPLACE_ME@postgres-ro:5432/youtbelimo
  CLIENT_ORIGIN: https://chat.example.com
  SEED_ADMIN_EMAIL: office@example.com
  SEED_ADMIN_USERNAME: admin
  SEED_ADMIN_PASSWORD: REPLACE_ME
  S3_ENDPOINT: https://s3.example.com
  S3_PUBLIC_ENDPOINT: https://media.example.com
  S3_BUCKET: youtbelimo-production
  S3_ACCESS_KEY_ID: REPLACE_ME
  S3_SECRET_ACCESS_KEY: REPLACE_ME
  MEDIA_ORIGINS: https://media.example.com
  LIVEKIT_URL: wss://media.example.com
  LIVEKIT_API_KEY: REPLACE_ME
  LIVEKIT_API_SECRET: REPLACE_ME
  LIVEKIT_KEYS: "REPLACE_ME: REPLACE_ME"
  TURN_URL: turns:turn.example.com:5349
  TURN_SHARED_SECRET: REPLACE_ME
  TURN_REALM: turn.example.com
  METRICS_TOKEN: REPLACE_ME
