worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 16384;
  multi_accept on;
}

http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  reset_timedout_connection on;
  types_hash_max_size 2048;
  gzip on;
  gzip_comp_level 4;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  upstream api {
    hash $cookie_ytbl_session consistent;
    server app-1:4000 max_fails=3 fail_timeout=10s;
    server app-2:4000 max_fails=3 fail_timeout=10s;
    keepalive 128;
  }

  limit_req_zone $binary_remote_addr zone=api_limit:20m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=per_ip:10m;

  server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    server_tokens off;
    limit_conn per_ip 100;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    location = /api/auth/login {
      limit_req zone=login_limit burst=5 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/files {
      limit_req zone=upload_limit burst=10 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering on;
    }

    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
    }

    location / {
      limit_req zone=api_limit burst=100 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }

    location /assets/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
