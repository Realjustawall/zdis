global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: youtbelimo
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [app-1:4000, app-2:4000]
    metrics_path: /api/metrics

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: youtbelimo-worker
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [worker:9464]
    metrics_path: /metrics

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: synthetic-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://gateway/api/ready
          - http://livekit:7880
          - http://minio:9000/minio/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
